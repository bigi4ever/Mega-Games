<script>
"use strict";
// ---------- זמן ריצה משותף לכל המשחקים ----------
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const T = CFG.theme, P = T.palette, S = CFG.params;
for (const [k, v] of Object.entries(P)) document.documentElement.style.setProperty('--' + k, v);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const G = { state: 'menu', score: 0 };
const keys = new Set();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const fmt = n => {
  if (n < 1000) return (Math.round(n * 10) / 10).toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(CFG.slug + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(CFG.slug + ':' + k, JSON.stringify(v)); } catch (e) {} },
};

let AC = null, MASTER = null, muted = store.get('muted', false);
// מנוע הצלילים: מתנד -> עוצמה -> מדחס -> יציאה. הדפדפן מאפשר להפעיל צלילים רק אחרי מגע או מקש,
// לכן המנוע נוצר ו"משוחרר" במגע הראשון בכל מקום בדף.
function audio() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    AC = new Ctx();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6;
    MASTER = AC.createGain(); MASTER.gain.value = 0.9;
    MASTER.connect(comp).connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
for (const ev of ['pointerdown', 'keydown', 'touchend']) window.addEventListener(ev, () => { try { audio(); } catch (e) {} }, { capture: true, passive: true });
function setMuted(v) { muted = v; store.set('muted', v); }
function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.04) {
  if (muted) return;
  try {
    const ac = audio(); if (!ac) return;
    const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    // העוצמות בתבניות קטנות (0.01-0.06), ולכן מוגברות כאן; גלים רכים (sine/triangle) מקבלים יותר
    const level = Math.min(0.6, vol * (type === 'sine' || type === 'triangle' ? 9 : 5));
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(level, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.04);
    o.connect(g).connect(MASTER); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}

// ציור אימוג'י דרך מטמון של קנבסים קטנים (מהיר בהרבה מ-fillText בכל פריים)
const emojiCache = new Map();
function drawEmoji(e, x, y, size, flip = false, alpha = 1) {
  const key = e + '|' + Math.round(size);
  let c = emojiCache.get(key);
  if (!c) {
    c = document.createElement('canvas');
    const px = Math.ceil(size * 1.35 * DPR);
    c.width = c.height = px;
    const g = c.getContext('2d');
    g.font = `${size * DPR}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(e, px / 2, px / 2 + size * 0.08 * DPR);
    emojiCache.set(key, c);
  }
  const s = c.width / DPR;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(c, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// אפקטים: חלקיקים וטקסט צף
const fx = [];
function burst(x, y, color, n = 10, speed = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(speed * 0.3, speed);
    fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 4) });
  }
}
function floatText(x, y, text, color = P.accent, size = 20) {
  fx.push({ x, y, vx: 0, vy: -50, life: 0.9, max: 0.9, text, color, size });
}
function updFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (!p.text) { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.life <= 0) fx.splice(i, 1);
  }
}
function drawFx(ox = 0, oy = 0) {
  for (const p of fx) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.text) {
      ctx.fillStyle = p.color; ctx.font = `900 ${p.size}px system-ui,sans-serif`; ctx.textAlign = 'center';
      ctx.strokeStyle = '#000a'; ctx.lineWidth = 4; ctx.strokeText(p.text, p.x - ox, p.y - oy); ctx.fillText(p.text, p.x - ox, p.y - oy);
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x - ox, p.y - oy, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ממשק: HUD וכרטיסים
const $ov = document.getElementById('ov'), $card = document.getElementById('card');
const $hudR = document.getElementById('hudR'), $hudL = document.getElementById('hudL');
function hud(right = '', left = '') {
  if ($hudR._v !== right) { $hudR.innerHTML = right; $hudR._v = right; }
  if ($hudL._v !== left) { $hudL.innerHTML = left; $hudL._v = left; }
}
function showCard(html) { $card.innerHTML = html; $ov.classList.remove('hidden'); }
function hideCard() { $ov.classList.add('hidden'); }

const soundBtn = () => `<div><button class="snd" id="snd">${muted ? '🔇 צלילים כבויים' : '🔊 צלילים פועלים'}</button></div>
  <a class="home-link" href="../../index.html">🏠 לכל המשחקים</a>`;
function wireSound() {
  const b = document.getElementById('snd'); if (!b) return;
  b.onclick = () => { setMuted(!muted); b.textContent = muted ? '🔇 צלילים כבויים' : '🔊 צלילים פועלים'; if (!muted) beep(660, 0.12, 'triangle', 0.05); };
}
function menu() {
  G.state = 'menu';
  const best = store.get('best', 0);
  showCard(`
    <div class="big">${CFG.icon}</div>
    <h1>${CFG.title}</h1>
    <p>${CFG.howto}</p>
    ${best ? `<div class="stat">🏆 שיא: ${fmt(best)}</div>` : ''}
    <button class="btn" id="play">▶ שחק</button>
    ${soundBtn()}
    <div class="credit">${CFG.genreName} · ${T.name} · נוצר אוטומטית ע"י Game Forge</div>`);
  document.getElementById('play').onclick = startGame;
  wireSound();
}
function startGame() {
  hideCard(); fx.length = 0; G.score = 0; G.state = 'play'; game.reset(); beep(660, 0.1, 'triangle');
}
function gameOver(score, extra = '') {
  G.state = 'over';
  const prev = store.get('best', 0), rec = score > prev;
  if (rec) store.set('best', score);
  beep(180, 0.4, 'sawtooth', 0.05);
  setTimeout(() => {
    showCard(`
      <div class="big">${rec ? '🏆' : '💥'}</div>
      <h1>${rec ? 'שיא חדש!' : 'המשחק נגמר'}</h1>
      <div class="stat">ניקוד: ${fmt(score)}</div>
      ${extra ? `<p>${extra}</p>` : ''}
      <p>שיא: ${fmt(Math.max(prev, score))}</p>
      <button class="btn" id="again">↻ שוב</button>
      ${soundBtn()}`);
    document.getElementById('again').onclick = startGame;
    wireSound();
  }, 450);
}

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  emojiCache.clear();
  if (typeof game !== 'undefined' && game.resize) game.resize();
}

const ptr = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
// אירועי קלט יכולים להגיע לפני שסקריפט המשחק נטען (למשל אצבע על המסך בזמן הטעינה), לכן בודקים שהמשחק קיים ושהלולאה התחילה
let booted = false;
const ready = () => booted && typeof game !== 'undefined';
const active = () => ready() && (G.state === 'play' || game.autostart);
cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch {} if (active()) game.down?.(...ptr(e)); });
cv.addEventListener('pointermove', e => { if (active()) game.move?.(...ptr(e)); });
cv.addEventListener('pointerup', e => { if (active()) game.up?.(...ptr(e)); });
cv.addEventListener('pointercancel', e => { if (ready() && G.state === 'play') game.up?.(...ptr(e)); });
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyM') { setMuted(!muted); const b = document.getElementById('snd'); if (b) b.textContent = muted ? '🔇 צלילים כבויים' : '🔊 צלילים פועלים'; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && (G.state === 'menu' || G.state === 'over') && !$ov.classList.contains('hidden')) {
    const b = $card.querySelector('.btn'); if (b) { b.click(); return; }
  }
  if (ready() && G.state === 'play') game.key?.(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
</script>
<script>
"use strict";
// ---------- לוגיקת המשחק (נוצרה מהתבנית: arrows) ----------
// פאזל חצים: לוחצים על חץ, והוא מחליק החוצה מהלוח בכיוון שלו, אם הדרך פנויה.
// חץ שנתקע בחץ אחר עולה בלב. מנקים את כל החצים כדי לעבור שלב.
//
// כל לוח פתיר בוודאות: הוא נבנה בסדר הפוך לסדר הפתרון. כל חץ חדש מונח רק אם הקרן שלו
// עד הקצה פנויה מכל החצים שכבר הונחו. החצים שהונחו קודם יוצאים אחריו, אז מסלולם
// יכול לעבור דרכו (הוא כבר לא יהיה שם). לכן הפתרון הוא להוציא בסדר הפוך להנחה.
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // ימינה, למטה, שמאלה, למעלה
let N, board, level, hearts, bx, by, cs, flying, shake, hint, cleared;
// וריאציה: 'timed' = שעון לכל שלב
const VAR = S.variant || 'classic';
let timeLeft = 0;

function rayLen(g, n, i, d) {
  // אורך הקרן עד הקצה, או -1 אם יש חוסם
  let x = i % n + DIRS[d][0], y = ((i / n) | 0) + DIRS[d][1], len = 0;
  while (x >= 0 && y >= 0 && x < n && y < n) {
    if (g[y * n + x] !== -1) return -1;
    x += DIRS[d][0]; y += DIRS[d][1]; len++;
  }
  return len;
}
function blocker(i) {
  let x = i % N + DIRS[board[i]][0], y = ((i / N) | 0) + DIRS[board[i]][1];
  while (x >= 0 && y >= 0 && x < N && y < N) {
    if (board[y * N + x] !== -1) return y * N + x;
    x += DIRS[board[i]][0]; y += DIRS[board[i]][1];
  }
  return -1;
}
function generate(n, density) {
  const g = new Array(n * n).fill(-1), want = Math.floor(n * n * density);
  let placed = 0;
  for (let tries = 0; placed < want && tries < 4000; tries++) {
    const i = randi(0, n * n - 1);
    if (g[i] !== -1) continue;
    // מעדיפים את הכיוון עם הקרן הארוכה ביותר: חצים שיוצאים מאוחר יותר יעברו דרכה, וזה יוצר תלויות
    let best = -1, bl = -1;
    for (const d of [0, 1, 2, 3].sort(() => Math.random() - 0.5)) {
      const l = rayLen(g, n, i, d);
      if (l > bl) { bl = l; best = d; }
    }
    if (best >= 0 && bl >= 0) { g[i] = best; placed++; }
  }
  return g;
}

function newLevel() {
  N = Math.min(S.maxSize, S.startSize + Math.floor((level - 1) / 2));
  board = generate(N, Math.min(0.92, S.density + level * 0.02));
  flying = []; shake = null; hint = null; hearts = S.hearts;
  const count = board.filter(v => v !== -1).length;
  if (VAR === 'timed') timeLeft = Math.ceil(count * S.secPerArrow) + 5;
  game.resize();
}

function remaining() { return board.filter(v => v !== -1).length; }
function hintBtn() { return { x: W / 2 - 70, y: by + cs * N + 22, w: 140, h: 44 }; }

const game = {
  resize() {
    if (!N) return;
    const size = Math.min(W * 0.94, H * 0.66, 600);
    cs = size / N; bx = (W - size) / 2; by = Math.max(64, (H - size) / 2 - 20);
  },
  reset() { level = 1; cleared = 0; newLevel(); },
  down(x, y) {
    const hb = hintBtn();
    if (x > hb.x && x < hb.x + hb.w && y > hb.y && y < hb.y + hb.h) {
      const free = board.map((d, i) => (d !== -1 && blocker(i) === -1 ? i : -1)).filter(i => i >= 0);
      if (free.length) { hint = { i: pick(free), t: 1.6 }; G.score = Math.max(0, G.score - 15); beep(600, 0.08, 'sine'); }
      return;
    }
    const cx = Math.floor((x - bx) / cs), cy = Math.floor((y - by) / cs);
    if (cx < 0 || cy < 0 || cx >= N || cy >= N) return;
    const i = cy * N + cx, d = board[i];
    if (d === -1) return;
    const b = blocker(i);
    if (b === -1) {
      board[i] = -1; cleared++;
      flying.push({ x: bx + (cx + 0.5) * cs, y: by + (cy + 0.5) * cs, d, v: 300, life: 1 });
      G.score += 10; if (hint && hint.i === i) hint = null;
      beep(520 + Math.random() * 200, 0.06, 'triangle');
      if (!remaining()) {
        const bonus = 50 * level + (VAR === 'timed' ? Math.ceil(timeLeft) * 10 : hearts * 25);
        G.score += bonus;
        floatText(W / 2, by + cs * N / 2, `שלב ${level} הושלם! +${bonus}`, P.accent, 28);
        beep(880, 0.15, 'triangle'); setTimeout(() => beep(1320, 0.2, 'triangle'), 120);
        level++;
        setTimeout(() => { if (G.state === 'play') newLevel(); }, 900);
      }
    } else {
      // החץ מתקדם עד החוסם וחוזר
      const dist = Math.max(Math.abs((b % N) - cx), Math.abs(((b / N) | 0) - cy)) - 1;
      shake = { i, d, dist: dist * cs + cs * 0.25, t: 0, blk: b };
      beep(140, 0.18, 'sawtooth', 0.05);
      if (VAR === 'timed') { timeLeft -= 3; floatText(bx + (cx + 0.5) * cs, by + (cy + 0.5) * cs, '-3 ⏱', P.danger, 20); }
      else if (--hearts <= 0) gameOver(G.score, `הגעת לשלב ${level} וניקית ${cleared} חצים`);
    }
  },
  update(dt) {
    if (VAR === 'timed' && remaining()) {
      timeLeft -= dt;
      if (timeLeft <= 0) { gameOver(G.score, `הזמן נגמר · הגעת לשלב ${level} וניקית ${cleared} חצים`); return; }
    }
    for (const f of flying) { f.v += 2600 * dt; f.x += DIRS[f.d][0] * f.v * dt; f.y += DIRS[f.d][1] * f.v * dt; f.life -= dt * 1.5; }
    flying = flying.filter(f => f.life > 0);
    if (shake) { shake.t += dt * 3; if (shake.t >= 1) shake = null; }
    if (hint) { hint.t -= dt; if (hint.t <= 0) hint = null; }
  },
  draw() {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    if (!board) return;
    const size = cs * N;
    ctx.fillStyle = P.bg2; roundRect(bx - 10, by - 10, size + 20, size + 20, 18); ctx.fill();
    for (let i = 0; i < N * N; i++) {
      const x = bx + (i % N) * cs, y = by + ((i / N) | 0) * cs;
      ctx.fillStyle = P.grid + '66'; ctx.beginPath(); ctx.arc(x + cs / 2, y + cs / 2, cs * 0.06, 0, 7); ctx.fill();
    }
    const arrow = (cx, cy, d, color, alpha = 1, glow = false) => {
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(d * Math.PI / 2);
      const s = cs * 0.42;
      if (glow) { ctx.shadowColor = P.accent; ctx.shadowBlur = 18; }
      ctx.fillStyle = color; roundRect(-s, -s, s * 2, s * 2, s * 0.35); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = P.bg;
      ctx.beginPath();
      ctx.moveTo(s * 0.62, 0); ctx.lineTo(s * 0.02, -s * 0.52); ctx.lineTo(s * 0.02, -s * 0.2); ctx.lineTo(-s * 0.6, -s * 0.2);
      ctx.lineTo(-s * 0.6, s * 0.2); ctx.lineTo(s * 0.02, s * 0.2); ctx.lineTo(s * 0.02, s * 0.52); ctx.closePath(); ctx.fill();
      ctx.restore();
    };
    for (let i = 0; i < N * N; i++) {
      if (board[i] === -1) continue;
      let cx = bx + (i % N + 0.5) * cs, cy = by + (((i / N) | 0) + 0.5) * cs, color = P.accent;
      if (shake && shake.i === i) {
        const k = Math.sin(shake.t * Math.PI) * shake.dist;
        cx += DIRS[shake.d][0] * k; cy += DIRS[shake.d][1] * k; color = P.danger;
      }
      if (shake && shake.blk === i) color = P.fg;
      arrow(cx, cy, board[i], color, 1, hint && hint.i === i && Math.floor(hint.t * 6) % 2 === 0);
    }
    for (const f of flying) arrow(f.x, f.y, f.d, P.accent, Math.max(0, f.life));
    const hb = hintBtn();
    ctx.fillStyle = P.bg2; roundRect(hb.x, hb.y, hb.w, hb.h, 12); ctx.fill();
    ctx.strokeStyle = P.grid; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = P.fg; ctx.font = '800 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💡 רמז (-15)', hb.x + hb.w / 2, hb.y + hb.h / 2 + 1); ctx.textBaseline = 'alphabetic';
    drawFx();
    const left = VAR === 'timed' ? `<span style="color:${timeLeft <= 5 ? P.danger : 'inherit'}">⏱ ${Math.max(0, Math.ceil(timeLeft))}</span>`
      : `${'❤️'.repeat(Math.max(0, hearts))}<span style="opacity:.35">${'🖤'.repeat(Math.max(0, S.hearts - hearts))}</span>`;
    hud(left,
      `${T.pickup} שלב ${level} · נשארו ${remaining()} · ⭐ ${G.score}`);
  },
};

</script>
<script>
"use strict";
window.addEventListener('resize', fit);
fit();
if (game.init) game.init();
if (game.autostart) { G.state = 'play'; game.reset(); } else menu();
booted = true;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'play') game.update(dt);
  updFx(G.state === 'pause' ? 0 : dt);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
