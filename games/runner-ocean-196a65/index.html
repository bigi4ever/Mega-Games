<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ריצה במעמקים</title>
<style>
  :root { --bg:#111; --bg2:#222; --fg:#fff; --accent:#fc3; --danger:#f44; --grid:#333; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: system-ui, "Segoe UI", "Rubik", Arial, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; font-weight:800; font-size:18px; pointer-events:none; text-shadow:0 2px 4px #000a; gap:10px; z-index:5; }
  #ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000a;
    backdrop-filter:blur(4px); z-index:20; padding:16px; box-sizing:border-box; }
  .card { background:var(--bg2); border:2px solid var(--accent); border-radius:20px; padding:24px 22px;
    width:min(420px,100%); text-align:center; box-shadow:0 12px 48px #000c; box-sizing:border-box; }
  .card h1 { margin:0 0 6px; font-size:30px; color:var(--accent); line-height:1.2; }
  .card h2 { margin:0 0 10px; font-size:22px; }
  .card p { opacity:.88; line-height:1.55; margin:8px 0; }
  .card .big { font-size:64px; line-height:1.1; margin:4px 0; }
  .card .stat { font-size:20px; font-weight:800; margin:6px 0; }
  .btn { background:var(--accent); color:var(--bg); border:0; border-radius:14px; padding:12px 28px; font-size:20px;
    font-weight:900; cursor:pointer; margin:8px 4px 0; font-family:inherit; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .choice { display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:var(--bg);
    color:var(--fg); border:2px solid var(--grid); border-radius:14px; padding:12px 14px; margin:8px 0; cursor:pointer;
    font:inherit; font-size:17px; font-weight:700; }
  .choice:hover { border-color:var(--accent); }
  .choice .ic { font-size:30px; }
  .hidden { display:none !important; }
  .credit { font-size:12px; opacity:.5; margin-top:14px; }
  .snd { background:none; border:1px solid var(--grid); color:var(--fg); border-radius:99px; padding:6px 14px; margin-top:12px; font:inherit; font-size:14px; cursor:pointer; opacity:.85; }
  
</style>

<body>

<div id="hud"><span id="hudR"></span><span id="hudL"></span></div>
<div id="app"></div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>
<script type="application/json" id="cfg">{"slug":"runner-ocean-196a65","title":"ריצה במעמקים","icon":"🐬","howto":"🐬 רץ בלי הפסקה. לחץ על המסך או על רווח כדי לקפוץ, ולחץ שוב באוויר לקפיצה כפולה. התחמק מ-🪸⚓ ואסוף 🐚.","genreName":"ריצה אינסופית","theme":{"id":"ocean","name":"אוקיינוס","palette":{"bg":"#062a40","bg2":"#0a3d5c","fg":"#e6f8ff","accent":"#4dfff3","danger":"#ff6b6b","grid":"#0f4c70"},"hero":"🐬","enemies":["🦈","🐙","🦑","🪼"],"boss":"🐋","pickup":"🐚","obstacle":["🪸","⚓"],"tiers":["💧","🫧","🐚","🦐","🐠","🐡","🐢","🐬","🐋","🔱"],"gems":["🐠","🐙","🦀","🐚","🐳","🪼"],"currency":"🐚","clickable":"🐚","buildings":[["🦀","סרטן אוסף"],["🐠","להקת דגים"],["🤿","צוללן"],["🚤","סירה"],["🏝️","אי"],["🔱","ממלכה תת-ימית"]],"words":{"place":"המעמקים","hero":"הדולפין","thing":"הפנינים","adj":"עמוק"}},"params":{"speed":280.768,"accel":5.2808,"gravity":2748.83,"jump":864.19,"gapMul":1.4024390243902438}}</script>
<script>
"use strict";
// ---------- זמן ריצה משותף לכל המשחקים ----------
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const T = CFG.theme, P = T.palette, S = CFG.params;
for (const [k, v] of Object.entries(P)) document.documentElement.style.setProperty('--' + k, v);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const G = { state: 'menu', score: 0 };
const keys = new Set();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const fmt = n => {
  if (n < 1000) return (Math.round(n * 10) / 10).toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(CFG.slug + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(CFG.slug + ':' + k, JSON.stringify(v)); } catch (e) {} },
};

let AC = null, MASTER = null, muted = store.get('muted', false);
// מנוע הצלילים: מתנד -> עוצמה -> מדחס -> יציאה. הדפדפן מאפשר להפעיל צלילים רק אחרי מגע או מקש,
// לכן המנוע נוצר ו"משוחרר" במגע הראשון בכל מקום בדף.
function audio() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    AC = new Ctx();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6;
    MASTER = AC.createGain(); MASTER.gain.value = 0.9;
    MASTER.connect(comp).connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
for (const ev of ['pointerdown', 'keydown', 'touchend']) window.addEventListener(ev, () => { try { audio(); } catch (e) {} }, { capture: true, passive: true });
function setMuted(v) { muted = v; store.set('muted', v); }
function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.04) {
  if (muted) return;
  try {
    const ac = audio(); if (!ac) return;
    const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    // העוצמות בתבניות קטנות (0.01-0.06), ולכן מוגברות כאן; גלים רכים (sine/triangle) מקבלים יותר
    const level = Math.min(0.6, vol * (type === 'sine' || type === 'triangle' ? 9 : 5));
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(level, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.04);
    o.connect(g).connect(MASTER); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}

// ציור אימוג'י דרך מטמון של קנבסים קטנים (מהיר בהרבה מ-fillText בכל פריים)
const emojiCache = new Map();
function drawEmoji(e, x, y, size, flip = false, alpha = 1) {
  const key = e + '|' + Math.round(size);
  let c = emojiCache.get(key);
  if (!c) {
    c = document.createElement('canvas');
    const px = Math.ceil(size * 1.35 * DPR);
    c.width = c.height = px;
    const g = c.getContext('2d');
    g.font = `${size * DPR}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(e, px / 2, px / 2 + size * 0.08 * DPR);
    emojiCache.set(key, c);
  }
  const s = c.width / DPR;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(c, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// אפקטים: חלקיקים וטקסט צף
const fx = [];
function burst(x, y, color, n = 10, speed = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(speed * 0.3, speed);
    fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 4) });
  }
}
function floatText(x, y, text, color = P.accent, size = 20) {
  fx.push({ x, y, vx: 0, vy: -50, life: 0.9, max: 0.9, text, color, size });
}
function updFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (!p.text) { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.life <= 0) fx.splice(i, 1);
  }
}
function drawFx(ox = 0, oy = 0) {
  for (const p of fx) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.text) {
      ctx.fillStyle = p.color; ctx.font = `900 ${p.size}px system-ui,sans-serif`; ctx.textAlign = 'center';
      ctx.strokeStyle = '#000a'; ctx.lineWidth = 4; ctx.strokeText(p.text, p.x - ox, p.y - oy); ctx.fillText(p.text, p.x - ox, p.y - oy);
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x - ox, p.y - oy, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ממשק: HUD וכרטיסים
const $ov = document.getElementById('ov'), $card = document.getElementById('card');
const $hudR = document.getElementById('hudR'), $hudL = document.getElementById('hudL');
function hud(right = '', left = '') {
  if ($hudR._v !== right) { $hudR.innerHTML = right; $hudR._v = right; }
  if ($hudL._v !== left) { $hudL.innerHTML = left; $hudL._v = left; }
}
function showCard(html) { $card.innerHTML = html; $ov.classList.remove('hidden'); }
function hideCard() { $ov.classList.add('hidden'); }

const soundBtn = () => `<div><button class="snd" id="snd">${muted ? '🔇 צלילים כבויים' : '🔊 צלילים פועלים'}</button></div>`;
function wireSound() {
  const b = document.getElementById('snd'); if (!b) return;
  b.onclick = () => { setMuted(!muted); b.textContent = muted ? '🔇 צלילים כבויים' : '🔊 צלילים פועלים'; if (!muted) beep(660, 0.12, 'triangle', 0.05); };
}
function menu() {
  G.state = 'menu';
  const best = store.get('best', 0);
  showCard(`
    <div class="big">${CFG.icon}</div>
    <h1>${CFG.title}</h1>
    <p>${CFG.howto}</p>
    ${best ? `<div class="stat">🏆 שיא: ${fmt(best)}</div>` : ''}
    <button class="btn" id="play">▶ שחק</button>
    ${soundBtn()}
    <div class="credit">${CFG.genreName} · ${T.name} · נוצר אוטומטית ע"י Game Forge</div>`);
  document.getElementById('play').onclick = startGame;
  wireSound();
}
function startGame() {
  hideCard(); fx.length = 0; G.score = 0; G.state = 'play'; game.reset(); beep(660, 0.1, 'triangle');
}
function gameOver(score, extra = '') {
  G.state = 'over';
  const prev = store.get('best', 0), rec = score > prev;
  if (rec) store.set('best', score);
  beep(180, 0.4, 'sawtooth', 0.05);
  setTimeout(() => {
    showCard(`
      <div class="big">${rec ? '🏆' : '💥'}</div>
      <h1>${rec ? 'שיא חדש!' : 'המשחק נגמר'}</h1>
      <div class="stat">ניקוד: ${fmt(score)}</div>
      ${extra ? `<p>${extra}</p>` : ''}
      <p>שיא: ${fmt(Math.max(prev, score))}</p>
      <button class="btn" id="again">↻ שוב</button>
      ${soundBtn()}`);
    document.getElementById('again').onclick = startGame;
    wireSound();
  }, 450);
}

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  emojiCache.clear();
  if (typeof game !== 'undefined' && game.resize) game.resize();
}

const ptr = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
// אירועי קלט יכולים להגיע לפני שסקריפט המשחק נטען (למשל אצבע על המסך בזמן הטעינה), לכן בודקים שהמשחק קיים ושהלולאה התחילה
let booted = false;
const ready = () => booted && typeof game !== 'undefined';
const active = () => ready() && (G.state === 'play' || game.autostart);
cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch {} if (active()) game.down?.(...ptr(e)); });
cv.addEventListener('pointermove', e => { if (active()) game.move?.(...ptr(e)); });
cv.addEventListener('pointerup', e => { if (active()) game.up?.(...ptr(e)); });
cv.addEventListener('pointercancel', e => { if (ready() && G.state === 'play') game.up?.(...ptr(e)); });
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyM') { setMuted(!muted); const b = document.getElementById('snd'); if (b) b.textContent = muted ? '🔇 צלילים כבויים' : '🔊 צלילים פועלים'; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && (G.state === 'menu' || G.state === 'over') && !$ov.classList.contains('hidden')) {
    const b = $card.querySelector('.btn'); if (b) { b.click(); return; }
  }
  if (ready() && G.state === 'play') game.key?.(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
</script>
<script>
"use strict";
// ---------- לוגיקת המשחק (נוצרה מהתבנית: runner) ----------
// ריצה אינסופית. שלוש וריאציות חוקים (S.variant):
//   classic - קפיצה וקפיצה כפולה מעל מכשולים
//   flip    - לחיצה הופכת את הכבידה: רצים על הרצפה או על התקרה, מכשולים משני הצדדים
//   fly     - מחזיקים כדי לעלות ומשחררים כדי לרדת, עוברים בין עמודים
const VAR = S.variant || 'classic';
let hero, obs, coins, pillars, distRun, speed, nextObs, nextCoins, coinsGot, passed, groundY, ceilY, t, holding, lastSide, lastGapY, started;

function jump() {
  if (VAR === 'flip') {
    if (!hero.grounded) return;
    hero.g *= -1; hero.grounded = false; hero.vy = 0;
    beep(hero.g > 0 ? 420 : 640, 0.08, 'triangle');
    burst(hero.x, hero.cy, P.fg, 5, 80);
    return;
  }
  if (VAR === 'fly') return;
  if (hero.jumps < 2) {
    hero.vy = -S.jump * (hero.jumps ? 0.85 : 1); hero.jumps++;
    beep(hero.jumps === 1 ? 520 : 780, 0.08, 'triangle');
    burst(hero.x, groundY, P.fg, 5, 80);
  }
}
function die() {
  burst(hero.x, VAR === 'classic' ? hero.y - hero.size / 2 : hero.cy, P.danger, 30, 250);
  const extra = VAR === 'fly' ? `עברת ${passed} עמודים ואספת ${coinsGot} ${T.pickup}` : `רצת ${Math.floor(distRun / 10)} מטר ואספת ${coinsGot} ${T.pickup}`;
  gameOver(G.score, extra);
}

const game = {
  resize() { groundY = H * 0.76; ceilY = Math.max(70, H * 0.18); },
  reset() {
    game.resize();
    hero = { x: Math.min(W * 0.22, 160), y: groundY, vy: 0, jumps: 0, size: 44, g: 1, grounded: true, cy: groundY - 22 };
    if (VAR === 'fly') hero.cy = (groundY + ceilY) / 2;
    obs = []; coins = []; pillars = []; distRun = 0; passed = 0; coinsGot = 0; t = 0; holding = false;
    speed = VAR === 'fly' ? S.speed * 0.7 : S.speed;
    nextObs = 1.2; nextCoins = 2; lastSide = 1; lastGapY = (groundY + ceilY) / 2;
    started = VAR !== 'fly'; // בטיסה: מרחפים במקום עד הלחיצה הראשונה
  },
  down() {
    holding = true;
    if (VAR === 'fly') { started = true; hero.vy = Math.min(hero.vy, -180); } // תגובה מיידית ללחיצה
    jump();
  },
  up() { holding = false; },
  key(code) {
    if (VAR === 'fly' && (code === 'Space' || code === 'ArrowUp' || code === 'KeyW')) { started = true; hero.vy = Math.min(hero.vy, -180); }
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') jump();
  },
  update(dt) {
    if (!started) { hero.cy = (groundY + ceilY) / 2 + Math.sin(performance.now() / 300) * 8; return; }
    t += dt;
    const maxSpeed = (VAR === 'fly' ? 0.7 : 1) * S.speed * 2.4;
    speed = Math.min(maxSpeed, speed + S.accel * (VAR === 'fly' ? 0.6 : 1) * dt);
    distRun += speed * dt;

    // ---- תנועת הגיבור ----
    if (VAR === 'classic') {
      hero.vy += S.gravity * dt; hero.y += hero.vy * dt;
      if (hero.y >= groundY) { hero.y = groundY; hero.vy = 0; hero.jumps = 0; }
    } else if (VAR === 'flip') {
      hero.vy += S.gravity * hero.g * dt; hero.cy += hero.vy * dt;
      const floor = groundY - hero.size / 2, ceil = ceilY + hero.size / 2;
      if (hero.cy >= floor) { hero.cy = floor; hero.vy = 0; hero.grounded = true; }
      if (hero.cy <= ceil) { hero.cy = ceil; hero.vy = 0; hero.grounded = true; }
    } else {
      const up = holding || keys.has('Space') || keys.has('ArrowUp') || keys.has('KeyW');
      hero.vy += (up ? -S.gravity * 0.7 : S.gravity * 0.4) * dt;
      hero.vy = clamp(hero.vy, -460, 430);
      hero.cy += hero.vy * dt;
      if (hero.cy + hero.size * 0.4 > groundY || hero.cy - hero.size * 0.4 < ceilY) { die(); return; }
    }

    // ---- יצירת מכשולים ----
    nextObs -= dt;
    if (nextObs <= 0) {
      const size = rand(36, 50);
      if (VAR === 'classic') {
        const fly = t > 12 && Math.random() < 0.22;
        obs.push({ x: W + 60, y: fly ? groundY - hero.size - 70 : groundY - size / 2 + 4, e: pick(T.obstacle), s: size, fly });
        if (!fly && t > 20 && Math.random() < 0.3) obs.push({ x: W + 60 + size * 0.95, y: groundY - size / 2 + 4, e: pick(T.obstacle), s: size, fly: false });
        nextObs = rand(0.75, 1.5) * Math.sqrt(S.speed / speed) * S.gapMul + 0.35;
      } else if (VAR === 'flip') {
        const side = Math.random() < 0.5 ? 1 : -1;
        obs.push({ x: W + 60, y: side > 0 ? groundY - size / 2 + 4 : ceilY + size / 2 - 4, e: pick(T.obstacle), s: size, flipY: side < 0 });
        // מעבר בין צדדים לוקח זמן, לכן מרווח גדול יותר כשהצד מתחלף
        nextObs = rand(0.7, 1.35) * Math.sqrt(S.speed / speed) * S.gapMul + (side !== lastSide ? 0.6 : 0.3);
        lastSide = side;
      } else {
        const gapH = Math.max(hero.size * 3.1, (groundY - ceilY) * 0.5 - t * 1.2);
        const lo = ceilY + gapH / 2 + 16, hi = groundY - gapH / 2 - 16;
        const gapY = clamp(lastGapY + rand(-150, 150), lo, hi);
        lastGapY = gapY;
        pillars.push({ x: W + 50, gapY, gapH, w: 58, passed: false, e: pick(T.obstacle) });
        if (Math.random() < 0.6) coins.push({ x: W + 50, y: gapY });
        nextObs = 290 / speed;
      }
    }
    if (VAR !== 'fly') {
      nextCoins -= dt;
      if (nextCoins <= 0) {
        const n = randi(3, 6);
        if (VAR === 'classic') {
          const h = rand(40, 150);
          for (let i = 0; i < n; i++) coins.push({ x: W + 40 + i * 38, y: groundY - 30 - h - Math.sin(i / (n - 1) * Math.PI) * 30 });
        } else {
          const top = Math.random() < 0.5;
          for (let i = 0; i < n; i++) coins.push({ x: W + 40 + i * 38, y: top ? ceilY + 26 : groundY - 26 });
        }
        nextCoins = rand(1.5, 3.5);
      }
    }
    for (const o of obs) o.x -= speed * dt * (o.fly ? 1.15 : 1);
    for (const p of pillars) p.x -= speed * dt;
    for (const c of coins) c.x -= speed * dt;
    obs = obs.filter(o => o.x > -80);
    pillars = pillars.filter(p => p.x > -80);
    coins = coins.filter(c => c.x > -40);

    // ---- התנגשויות ----
    const hx = hero.x, hy = VAR === 'classic' ? hero.y - hero.size / 2 : hero.cy;
    for (const o of obs) {
      if (Math.abs(o.x - hx) < (o.s + hero.size) * 0.36 && Math.abs(o.y - hy) < (o.s + hero.size) * 0.36) { die(); return; }
    }
    for (const p of pillars) {
      const r = hero.size * 0.34;
      if (Math.abs(p.x - hx) < p.w / 2 + r && (hy - r < p.gapY - p.gapH / 2 || hy + r > p.gapY + p.gapH / 2)) { die(); return; }
      if (!p.passed && p.x < hx) { p.passed = true; passed++; beep(660, 0.04, 'triangle', 0.02); }
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      if (dist(coins[i].x, coins[i].y, hx, hy) < 34) {
        floatText(coins[i].x, coins[i].y, '+10'); coins.splice(i, 1); coinsGot++; beep(1100, 0.05, 'sine', 0.03);
      }
    }
    G.score = Math.floor(distRun / 10) + coinsGot * 10 + passed * 10;
  },
  draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, P.bg); g.addColorStop(1, P.bg2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const d = distRun || 0;
    // שכבות פרלקסה
    const layer = (k, amp, base, color, step) => {
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + step; x += step) {
        const wx = x + d * k;
        ctx.lineTo(x, base - Math.abs(Math.sin(wx / step * 1.3) * amp) - Math.abs(Math.sin(wx / (step * 2.7))) * amp * 0.6);
      }
      ctx.lineTo(W, H); ctx.fill();
    };
    ctx.globalAlpha = 0.5; layer(0.15, 90, groundY - 40, P.grid, 120);
    ctx.globalAlpha = 0.8; layer(0.4, 50, groundY - 5, P.bg2, 80);
    ctx.globalAlpha = 1;
    // קרקע (ובווריאציות flip/fly גם תקרה)
    ctx.fillStyle = P.grid; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = P.accent; ctx.fillRect(0, groundY, W, 4);
    if (VAR !== 'classic') {
      ctx.fillStyle = P.grid; ctx.fillRect(0, 0, W, ceilY);
      ctx.fillStyle = P.accent; ctx.fillRect(0, ceilY - 4, W, 4);
    }
    ctx.fillStyle = '#ffffff14';
    for (let x = -(d % 60); x < W; x += 60) {
      ctx.fillRect(x, groundY + 18, 30, 6);
      if (VAR !== 'classic') ctx.fillRect(x, ceilY - 24, 30, 6);
    }

    if (!hero) return;
    for (const p of pillars) {
      const top = p.gapY - p.gapH / 2, bot = p.gapY + p.gapH / 2;
      ctx.fillStyle = P.bg2; ctx.strokeStyle = P.accent; ctx.lineWidth = 3;
      roundRect(p.x - p.w / 2, ceilY - 10, p.w, top - ceilY + 10, 10); ctx.fill(); ctx.stroke();
      roundRect(p.x - p.w / 2, bot, p.w, groundY - bot + 10, 10); ctx.fill(); ctx.stroke();
      drawEmoji(p.e, p.x, top - 18, 30); drawEmoji(p.e, p.x, bot + 18, 30);
    }
    for (const c of coins) drawEmoji(T.pickup, c.x, c.y + Math.sin(performance.now() / 200 + c.x / 50) * 3, 28);
    for (const o of obs) {
      if (o.flipY) { ctx.save(); ctx.translate(o.x, o.y); ctx.scale(1, -1); drawEmoji(o.e, 0, 0, o.s); ctx.restore(); }
      else drawEmoji(o.e, o.x, o.y, o.s);
    }
    if (VAR === 'classic') {
      const bob = hero.jumps ? 0 : Math.abs(Math.sin(distRun / 30)) * 4;
      ctx.fillStyle = '#0005'; ctx.beginPath();
      ctx.ellipse(hero.x, groundY + 4, Math.max(2, 18 * (1 - (groundY - hero.y) / 400)), 5, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(hero.x, hero.y - hero.size / 2 - bob);
      if (hero.jumps) ctx.rotate(hero.vy / 2500);
      drawEmoji(T.hero, 0, 0, hero.size, true);
      ctx.restore();
    } else {
      const bob = VAR === 'flip' && hero.grounded ? Math.abs(Math.sin(distRun / 30)) * 4 * hero.g : 0;
      ctx.save(); ctx.translate(hero.x, hero.cy - bob);
      if (VAR === 'flip' && hero.g < 0) ctx.scale(1, -1);
      if (VAR === 'fly') ctx.rotate(clamp(hero.vy / 1400, -0.4, 0.4));
      drawEmoji(T.hero, 0, 0, hero.size, true);
      ctx.restore();
    }
    drawFx();
    if (VAR === 'fly' && !started) {
      ctx.fillStyle = P.fg; ctx.font = '800 20px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('החזק כדי לעוף', W / 2, (groundY + ceilY) / 2 + 70);
    }
    if (VAR === 'fly') hud(`${T.pickup} ${coinsGot}`, `🏛️ ${passed} · ⭐ ${G.score}`);
    else hud(`${T.pickup} ${coinsGot}`, `📏 ${Math.floor(distRun / 10)} מ' · ⭐ ${G.score}`);
  },
};

</script>
<script>
"use strict";
window.addEventListener('resize', fit);
fit();
if (game.init) game.init();
if (game.autostart) { G.state = 'play'; game.reset(); } else menu();
booted = true;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'play') game.update(dt);
  updFx(G.state === 'pause' ? 0 : dt);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
